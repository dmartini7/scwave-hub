<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-T9ZL1CM490"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-T9ZL1CM490');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — SC Wave Player Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0D0D0D;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 700px 500px at 70% 40%, rgba(245,197,24,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 500px 400px at 20% 80%, rgba(0,212,228,0.04) 0%, transparent 60%);
      pointer-events: none;
    }

    .login-card {
      position: relative;
      z-index: 1;
      background: #131313;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 48px 44px 40px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 32px 80px rgba(0,0,0,0.6);
      margin: 24px;
    }

    .login-logo {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: rgba(245,197,24,0.1);
      border: 2px solid rgba(245,197,24,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      overflow: hidden;
    }
    .login-logo img { width: 100%; height: 100%; object-fit: contain; }

    .mls-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border: 1px solid rgba(0,212,228,0.25);
      border-radius: 20px;
      margin-bottom: 18px;
      font-size: 10px;
      font-weight: 700;
      color: #00D4E4;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .login-club {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #F5C518;
      margin-bottom: 6px;
    }

    .login-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 34px;
      color: #fff;
      letter-spacing: 0.02em;
      line-height: 1;
      margin-bottom: 10px;
    }
    .login-title span { color: #F5C518; }

    .login-sub {
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 20px;
      background: #fff;
      color: #1f1f1f;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s, opacity 0.15s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      margin-bottom: 28px;
    }
    .btn-google:hover { background: #f0f0f0; box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
    .btn-google:disabled { opacity: 0.6; cursor: not-allowed; }

    .error-msg {
      display: none;
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.4);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #fca5a5;
      margin-bottom: 16px;
      text-align: left;
    }

    .login-footer {
      font-size: 11px;
      color: rgba(255,255,255,0.2);
      line-height: 1.7;
    }
    .login-footer strong { color: rgba(255,255,255,0.4); }
    .login-footer a { color: #00D4E4; text-decoration: none; }
  </style>
</head>
<body>

<div class="login-card">
  <div class="login-logo">
    <img src="assets/scwave-logo.png" alt="SC Wave" />
  </div>

  <div class="mls-badge">⚽ MLS NEXT · SC Wave</div>

  <div class="login-club">SC Wave Soccer Club</div>
  <div class="login-title">SC Wave <span>Player Hub</span></div>
  <div class="login-sub">Members only. Sign in to access training resources, staff info, and club documents.</div>

  <div class="error-msg" id="error-msg"></div>

  <button class="btn-google" id="google-btn">
    <svg width="20" height="20" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    Continue with Google
  </button>

  <div class="login-footer">
    Access is restricted to <strong>SC Wave MLS NEXT members</strong>.<br />
    Having trouble? Contact Daniel Mattos at <a href="mailto:danielmartini07@gmail.com">danielmartini07@gmail.com</a>
  </div>
</div>

<script type="module">
  import { auth, googleProvider } from './js/firebase-auth.js';
  import { onAuthStateChanged, signInWithPopup } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

  // If already signed in, go straight to hub
  onAuthStateChanged(auth, (user) => {
    if (user) window.location.href = 'index.html';
  });

  document.getElementById('google-btn').addEventListener('click', async () => {
    const btn = document.getElementById('google-btn');
    const err = document.getElementById('error-msg');
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    err.style.display = 'none';
    try {
      await signInWithPopup(auth, googleProvider);
      window.location.href = 'index.html';
    } catch (e) {
      err.textContent = 'Sign-in failed. Please try again or contact Coach Daniel.';
      err.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Continue with Google`;
    }
  });
</script>

</body>
</html>
